<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0B0B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Ardenus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#0B0B0B;overflow:hidden}
  #v{position:fixed;inset:0;width:100vw;height:100vh;object-fit:contain;background:#000}
  #gate{
    position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(120% 90% at 50% 40%, #17181B 0%, #0B0B0B 62%);
    cursor:pointer;transition:opacity .5s ease;
    font-family:'Hanken Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  #gate.hide{opacity:0;pointer-events:none}
  .logo{position:relative;width:min(56vw,300px);opacity:0;transform:translateY(10px);animation:rise .9s .15s ease forwards;overflow:hidden}
  .logo img{display:block;width:100%}
  .sweep{position:absolute;inset:0;background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.55) 50%,transparent 58%);
         transform:translateX(-130%);animation:sweep 1.7s .55s ease forwards;pointer-events:none}
  .play{
    margin-top:56px;width:86px;height:86px;border-radius:999px;border:1.5px solid rgba(255,255,255,.42);
    display:flex;align-items:center;justify-content:center;opacity:0;
    animation:rise .9s .55s ease forwards, breathe 2.8s 1.5s ease-in-out infinite;
    transition:transform .15s ease,border-color .15s ease;
  }
  #gate:active .play{transform:scale(.93);border-color:#fff;animation:rise .9s .55s ease forwards}
  .play svg{margin-left:6px}
  .cap{margin-top:26px;color:rgba(244,244,242,.48);font-size:14px;font-weight:500;letter-spacing:.07em;
       opacity:0;animation:rise .9s .72s ease forwards}
  @keyframes rise{to{opacity:1;transform:translateY(0)}}
  @keyframes sweep{to{transform:translateX(130%)}}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.055)}}
  @media (prefers-reduced-motion:reduce){.sweep,.play{animation:rise .01s forwards}.logo,.cap{animation:rise .01s forwards}}
</style>
</head>
<body>
<video id="v" playsinline preload="auto" src="ardenus.mp4"></video>
<div id="gate">
  <div class="logo"><img src="logo.svg" alt="Ardenus"><div class="sweep"></div></div>
  <div class="play"><svg width="27" height="31" viewBox="0 0 27 31"><path d="M0 0 L27 15.5 L0 31 Z" fill="#fff"/></svg></div>
  <div class="cap">Tap to watch the film</div>
</div>
<script>
  var v = document.getElementById('v'), gate = document.getElementById('gate'), cap = gate.querySelector('.cap');
  function start(){
    gate.classList.add('hide');
    v.muted = false;
    var p = v.play(); if (p && p.catch) p.catch(function(){});
    var el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen().catch(function(){});
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  }
  gate.addEventListener('click', start);
  v.addEventListener('ended', function(){ cap.textContent = 'Tap to replay'; v.currentTime = 0; gate.classList.remove('hide'); });
</script>
</body>
</html>

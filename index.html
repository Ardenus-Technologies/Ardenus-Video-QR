<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Ardenus</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#000;overflow:hidden}
  #v{position:fixed;inset:0;width:100vw;height:100vh;object-fit:contain;background:#000}
  #gate{
    position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:#000;cursor:pointer;transition:opacity .45s ease;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  #gate.hide{opacity:0;pointer-events:none}
  .mark{color:#fff;font-size:24px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;opacity:.92}
  .play{
    margin-top:34px;width:92px;height:92px;border-radius:999px;border:1.5px solid rgba(255,255,255,.5);
    display:flex;align-items:center;justify-content:center;transition:transform .15s ease,border-color .15s ease;
  }
  #gate:active .play{transform:scale(.94);border-color:#fff}
  .play svg{margin-left:6px}
  .hint{margin-top:24px;color:rgba(255,255,255,.5);font-size:14px;letter-spacing:.04em}
</style>
</head>
<body>
<video id="v" playsinline preload="auto" src="ardenus.mp4"></video>
<div id="gate">
  <div class="mark">Ardenus</div>
  <div class="play"><svg width="30" height="34" viewBox="0 0 30 34"><path d="M0 0 L30 17 L0 34 Z" fill="#fff"/></svg></div>
  <div class="hint">Tap to play</div>
</div>
<script>
  var v = document.getElementById('v'),
      gate = document.getElementById('gate'),
      hint = gate.querySelector('.hint');
  function start(){
    gate.classList.add('hide');
    v.muted = false;
    var p = v.play();
    if (p && p.catch) p.catch(function(){});
    var el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen().catch(function(){});
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  }
  gate.addEventListener('click', start);
  v.addEventListener('ended', function(){
    hint.textContent = 'Tap to replay';
    v.currentTime = 0;
    gate.classList.remove('hide');
  });
</script>
</body>
</html>
